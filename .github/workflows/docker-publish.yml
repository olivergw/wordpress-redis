name: Build and Push to Docker Hub

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/wordpress-redis

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Redis version
        id: redis_version
        run: |
          REDIS_TAG=$(grep -oP 'FROM redis:\K[^\s]+' Dockerfile)
          echo "tag=${REDIS_TAG}" >> $GITHUB_OUTPUT
          VERSION=$(echo "${REDIS_TAG}" | grep -oP '^[\d.]+')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "minor=${VERSION%.*}" >> $GITHUB_OUTPUT
          echo "major=${VERSION%%.*}" >> $GITHUB_OUTPUT
          VARIANT=$(echo "${REDIS_TAG}" | grep -oP '(?<=[\d.]-).*' || true)
          if [ -n "${VARIANT}" ]; then
            echo "version_variant=${VERSION}-${VARIANT}" >> $GITHUB_OUTPUT
            echo "minor_variant=${VERSION%.*}-${VARIANT}" >> $GITHUB_OUTPUT
            echo "major_variant=${VERSION%%.*}-${VARIANT}" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.redis_version.outputs.tag }}
            type=raw,value=${{ steps.redis_version.outputs.version_variant }}
            type=raw,value=${{ steps.redis_version.outputs.minor_variant }}
            type=raw,value=${{ steps.redis_version.outputs.major_variant }}
            type=raw,value=${{ steps.redis_version.outputs.version }}
            type=raw,value=${{ steps.redis_version.outputs.minor }}
            type=raw,value=${{ steps.redis_version.outputs.major }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
