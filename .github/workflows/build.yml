name: Build and Push Docker Image

on:
  push:
    branches:
      - master
  tags:
    - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js 24
      uses: actions/setup-node@v3
      with:
        node-version: 24

    - name: Extract Redis version
      id: version
      run: |
        VERSION=$(grep '^FROM' Dockerfile | head -1 | cut -d: -f2 | cut -d@ -f1)
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        # Derive major.minor.suffix for minor tag
        IFS='.' read -r MAJOR MINOR SUFFIX <<< "$VERSION"
        echo "minor_tag=${MAJOR}.${MINOR}-${SUFFIX}" >> "$GITHUB_OUTPUT"

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          olivergw/wordpress-redis:latest
          olivergw/wordpress-redis:v${{ steps.version.outputs.version }}
          olivergw/wordpress-redis:v${{ steps.version.outputs.minor_tag }}
